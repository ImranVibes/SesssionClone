<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 280" width="440" height="280">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="promoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="60%" stop-color="#070b14"/>
      <stop offset="100%" stop-color="#030508"/>
    </linearGradient>

    <!-- Radial Glows -->
    <radialGradient id="centerGlow" cx="30%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#2563eb" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Card Gradients -->
    <linearGradient id="pBackCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="pFrontCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111c33" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#09101f" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="pFrontBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="pSyncGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <filter id="pCardShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
    <filter id="pGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#38bdf8" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Solid Background -->
  <rect width="440" height="280" fill="url(#promoBg)"/>
  <!-- Ambient Glow -->
  <rect width="440" height="280" fill="url(#centerGlow)"/>

  <!-- Subtle Grid Accent -->
  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="70" x2="440" y2="70"/>
    <line x1="0" y1="140" x2="440" y2="140"/>
    <line x1="0" y1="210" x2="440" y2="210"/>
    <line x1="110" y1="0" x2="110" y2="280"/>
    <line x1="220" y1="0" x2="220" y2="280"/>
    <line x1="330" y1="0" x2="330" y2="280"/>
  </g>

  <!-- Left: The Dual-Card Icon Emblem (Scaled & Centered at x=105, y=140) -->
  <g transform="translate(18, 30)">
    <!-- Back Card -->
    <g filter="url(#pCardShadow)">
      <rect x="44" y="38" width="94" height="126" rx="18" fill="url(#pBackCard)" stroke="#334155" stroke-width="1.8"/>
      <rect x="58" y="56" width="36" height="5" rx="2.5" fill="#334155"/>
      <rect x="58" y="68" width="56" height="3" rx="1.5" fill="#1e293b"/>
      <rect x="58" y="76" width="44" height="3" rx="1.5" fill="#1e293b"/>
    </g>

    <!-- Front Card -->
    <g filter="url(#pCardShadow)">
      <rect x="80" y="64" width="94" height="126" rx="18" fill="url(#pFrontCard)" stroke="url(#pFrontBorder)" stroke-width="2"/>
      <rect x="94" y="82" width="42" height="5" rx="2.5" fill="#38bdf8" fill-opacity="0.8"/>
      <rect x="94" y="94" width="60" height="3" rx="1.5" fill="#1e293b"/>
      <rect x="94" y="102" width="46" height="3" rx="1.5" fill="#1e293b"/>
    </g>

    <!-- Sync Bridge -->
    <g filter="url(#pGlow)">
      <!-- Left loop -->
      <path d="M 100 134 C 88 134 80 126 80 114 C 80 102 88 94 100 94 L 110 94 C 114 94 118 97 118 101 C 118 105 114 108 110 108 L 100 108 C 96 108 93 111 93 114 C 93 117 96 120 100 120 L 110 120 C 114 120 118 123 118 127 C 118 131 114 134 110 134 Z" fill="url(#pSyncGrad)"/>
      <!-- Right loop -->
      <path d="M 124 94 C 136 94 144 102 144 114 C 144 126 136 134 124 134 L 114 134 C 110 134 106 131 106 127 C 106 123 110 120 114 120 L 124 120 C 128 120 131 117 131 114 C 131 111 128 108 124 108 L 114 108 C 110 108 106 105 106 101 C 106 97 110 94 114 94 Z" fill="url(#pSyncGrad)"/>
      <rect x="105" y="111" width="14" height="6" rx="3" fill="#38bdf8"/>
      <circle cx="93" cy="114" r="2.5" fill="#ffffff"/>
      <circle cx="131" cy="114" r="2.5" fill="#ffffff"/>
    </g>
  </g>

  <!-- Right: Crisp Branding & Typography -->
  <g transform="translate(225, 82)">
    <!-- Pill badge -->
    <rect x="0" y="0" width="138" height="22" rx="11" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <circle cx="10" cy="11" r="3.5" fill="#10b981"/>
    <text x="20" y="15" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="600" letter-spacing="0.5">DEV SESSION TOOLS</text>

    <!-- Product Title -->
    <text x="0" y="58" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="700" letter-spacing="-0.5">SessionClone</text>

    <!-- Tagline -->
    <text x="0" y="80" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">Universal Session &amp; Cookie Manager</text>

    <!-- Feature Checklist -->
    <g transform="translate(0, 102)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">
      <text x="0" y="0">✓ 1-Click Session Migration</text>
      <text x="0" y="18">✓ AES-256 Authenticated Encryption</text>
      <text x="0" y="36">✓ Deep Anti-Tracking Purge</text>
    </g>
  </g>
</svg>
